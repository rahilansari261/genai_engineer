# Same pattern as Projects 5 and 6 — backend + Ollama in containers,
# frontend runs natively with npm.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # See Project 6's README for why this is here: this Docker Desktop
    # setup can fail to resolve external hostnames from inside a
    # container (Wikipedia, Hugging Face, OpenAI) without it, even though
    # raw outbound connectivity works fine.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./backend:/app
      - whisper_cache:/root/.cache
    env_file:
      - ./backend/.env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  whisper_cache:
  ollama_data:
