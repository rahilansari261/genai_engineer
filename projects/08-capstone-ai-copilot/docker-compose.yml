# Same pattern as Projects 5, 6, and 7 — backend + Ollama in containers,
# frontend runs natively with npm.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # See Project 6's README: this Docker Desktop setup can fail to
    # resolve external hostnames (Wikipedia, Hugging Face, OpenAI) from
    # inside a container without this, even though raw connectivity works.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./backend:/app
      - chroma_data:/app/chroma_data
      - model_cache:/root/.cache
    env_file:
      - ./backend/.env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  chroma_data:
  model_cache:
  ollama_data:
